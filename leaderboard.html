<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playoff Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --qb: #2563eb;
      --rb: #16a34a;
      --wr: #ea580c;
      --te: #7c3aed;
      --ink: #16241d;
      --muted: #5b6b62;
      --border: #dde3dc;
      --bg-page: #f3f5f1;
      --field: #0b3d2e;
      --field-dark: #062920;
      --gold: #f2b705;
      --gold-dark: #c99a04;
      --chalk: #f7faf7;
      --silver: #9ca3af;
      --bronze: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      margin: 0; background: var(--bg-page); color: var(--ink);
    }
    a { color: inherit; }
    .display { font-family: "Anton", "Inter", sans-serif; letter-spacing: 0.03em; text-transform: uppercase; }

    nav {
      display: flex; align-items: center; gap: 14px; padding: 12px 16px;
      background: var(--field-dark); border-bottom: 3px solid var(--gold);
    }
    nav a {
      color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
      opacity: 0.6; padding: 4px 0; letter-spacing: 0.03em;
    }
    nav a.active { opacity: 1; color: var(--gold); border-bottom: 2px solid var(--gold); }

    header {
      position: sticky; top: 0; z-index: 10; padding: 20px 16px 16px;
      background: repeating-linear-gradient(180deg, var(--field) 0 40px, #0e4634 40px 44px), var(--field);
      color: var(--chalk); box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    h1 { font-size: 26px; margin: 0; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
    .sub { color: #cfe3d9; font-size: 12px; margin-top: 4px; font-weight: 600; }
    main { padding: 14px 12px 40px; max-width: 720px; margin: 0 auto; }

    .controls { display: flex; gap: 10px; margin-top: 14px; }
    button {
      flex: 1; padding: 10px 12px; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.12); color: #fff; font-weight: 800; font-size: 12px;
      cursor: pointer; letter-spacing: 0.03em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.25);
    }
    button:active { transform: scale(0.98); }
    .muted { color: #cfe3d9; font-size: 11px; margin-top: 8px; }
    .error { color: #b91c1c; font-weight: 700; }

    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      margin: 10px 0; box-shadow: 0 1px 2px rgba(0,0,0,.04); overflow: hidden;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; cursor: pointer;
    }
    .row:active { background: #fafafa; }
    .rank {
      font-family: "Anton", sans-serif; font-size: 16px; width: 34px; height: 34px;
      flex-shrink: 0; border-radius: 50%; background: var(--field);
      color: #fff; display: flex; align-items: center; justify-content: center;
      letter-spacing: 0;
    }
    .name { font-weight: 700; font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pts { font-weight: 900; font-size: 18px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .chevron { color: var(--muted); font-size: 12px; margin-left: 6px; transition: transform .15s ease; flex-shrink: 0; }
    .card.open .chevron { transform: rotate(90deg); }

    .roster {
      display: none; border-top: 1px solid var(--border); padding: 6px 14px 12px;
    }
    .card.open .roster { display: block; }
    .rplayer {
      display: flex; align-items: center; gap: 10px; padding: 7px 0;
      border-bottom: 1px dashed var(--border);
    }
    .rplayer:last-child { border-bottom: none; }
    .pos-tag {
      font-weight: 800; font-size: 10px; color: #fff; border-radius: 6px;
      padding: 3px 6px; width: 30px; text-align: center; flex-shrink: 0;
    }
    .pos-tag.QB { background: var(--qb); }
    .pos-tag.RB1, .pos-tag.RB2 { background: var(--rb); }
    .pos-tag.WR1, .pos-tag.WR2, .pos-tag.WR3 { background: var(--wr); }
    .pos-tag.TE { background: var(--te); }
    .rplayer .pname { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rplayer .pteam { font-size: 12px; color: var(--muted); width: 36px; flex-shrink: 0; }
    .rplayer .ppts { font-weight: 700; font-size: 14px; width: 48px; text-align: right; flex-shrink: 0; }
    .roster-empty { padding: 10px 0; font-size: 13px; color: var(--muted); }

    .medal-1 { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .medal-1 .rank { background: var(--gold); color: var(--field-dark); }
    .medal-2 .rank { background: var(--silver); color: #1a1a1a; }
    .medal-3 .rank { background: var(--bronze); color: #fff; }
    .medal-1 .pts { color: var(--gold-dark); }

    .round-banner {
      display: none; margin-top: 12px; padding: 6px 14px; border-radius: 999px;
      background: rgba(242,183,5,0.16); border: 1px solid var(--gold); color: #fff;
      font-weight: 800; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .round-banner.show { display: inline-block; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Submit Picks</a>
    <a href="leaderboard.html" class="active">Leaderboard</a>
  </nav>

  <header>
    <h1 class="display">🏆 Playoff Leaderboard</h1>
    <div class="sub" id="updated">Updating…</div>
    <div><span class="round-banner" id="roundBanner"></span></div>
    <div class="controls">
      <button id="refresh">Refresh</button>
      <button id="toggle">Show Top 10</button>
    </div>
    <div class="muted" id="hint"></div>
  </header>

  <main id="app"></main>

  <script>
    // Published CSV link (PublicLeaderboard -> CSV)
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1YGhr0zUKlvaFxmPV6QPmwVTeDIuAmyTTqCZLe2b6mUrXbyOKC7N1hrZXRcSmkXRa2CUNAF64cBgI/pub?gid=630467273&single=true&output=csv";

    const ROSTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1YGhr0zUKlvaFxmPV6QPmwVTeDIuAmyTTqCZLe2b6mUrXbyOKC7N1hrZXRcSmkXRa2CUNAF64cBgI/pub?gid=2086137848&single=true&output=csv";

    let showTop10 = true;
    let rosterByName = {};
    const openNames = new Set();

    const app = document.getElementById("app");
    const updated = document.getElementById("updated");
    const hint = document.getElementById("hint");

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function withCacheBust(url) {
      const sep = url.includes("?") ? "&" : "?";
      return url + sep + "_=" + Date.now();
    }

    // CSV parser that handles commas inside quotes
    function splitCSVLine(line) {
      const out = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];

        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    function parseCSVRows(text) {
      const raw = text.trim();
      if (!raw) return [];
      const lines = raw.split(/\r?\n/);
      if (lines.length < 2) return [];
      return lines.slice(1).filter(l => l.trim()).map(l => splitCSVLine(l).map(s => s.trim()));
    }

    function parseRoundLabel(text) {
      const raw = text.trim();
      if (!raw) return "";
      const lines = raw.split(/\r?\n/);
      if (!lines.length) return "";
      const header = splitCSVLine(lines[0]).map(s => s.trim().toLowerCase());
      const idx = header.indexOf("round");
      if (idx === -1) return "";
      for (const line of lines.slice(1)) {
        if (!line.trim()) continue;
        const cols = splitCSVLine(line).map(s => s.trim());
        if (cols[idx]) return cols[idx];
      }
      return "";
    }

    function parseLeaderboard(text) {
      const rows = parseCSVRows(text);
      const out = [];

      for (const cols of rows) {
        let rank = "", medal = "", name = "", total = "0";

        if (cols.length >= 4) {
          [rank, medal, name, total] = cols;
        } else if (cols.length === 3) {
          [rank, name, total] = cols;
          medal = "";
        } else {
          continue;
        }

        const numTotal = Number(String(total).replace(/[^0-9.\-]/g, "")) || 0;
        out.push({ rank, medal, name, total: numTotal });
      }

      return out.filter(r => r.name);
    }

    function parseRoster(text) {
      const rows = parseCSVRows(text);
      const map = {};

      for (const cols of rows) {
        if (cols.length < 5) continue;
        const [name, position, player, team, points] = cols;
        if (!name) continue;
        const numPoints = Number(String(points).replace(/[^0-9.\-]/g, "")) || 0;
        (map[name] = map[name] || []).push({ position, player, team, points: numPoints });
      }

      // Fixed slot order for display
      const order = ["QB", "RB1", "RB2", "WR1", "WR2", "WR3", "TE"];
      for (const name in map) {
        map[name].sort((a, b) => order.indexOf(a.position) - order.indexOf(b.position));
      }

      return map;
    }

    function renderRoster(name) {
      const players = rosterByName[name];
      if (!players || !players.length) {
        return `<div class="roster-empty">No roster data yet.</div>`;
      }
      return players.map(p => `
        <div class="rplayer">
          <div class="pos-tag ${escapeHtml(p.position)}">${escapeHtml(p.position)}</div>
          <div class="pname">${escapeHtml(p.player)}</div>
          <div class="pteam">${escapeHtml(p.team)}</div>
          <div class="ppts">${p.points.toFixed(1)}</div>
        </div>
      `).join("");
    }

    function render(rows) {
      app.innerHTML = "";

      if (!rows || !rows.length) {
        app.innerHTML = `<div class="card"><div class="row"><div class="error">No rows parsed. Check that your published CSV contains Name + Total columns.</div></div></div>`;
        return;
      }

      const sorted = [...rows].sort((a, b) => (b.total || 0) - (a.total || 0));
      const view = showTop10 ? sorted.slice(0, 10) : sorted;

      for (let i = 0; i < view.length; i++) {
        const r = view[i];
        const displayRank = (r.medal && r.medal.trim()) ? r.medal.trim() : `#${i + 1}`;
        const isOpen = openNames.has(r.name);

        const el = document.createElement("div");
        el.className = "card" + (isOpen ? " open" : "") + (i === 0 ? " medal-1" : i === 1 ? " medal-2" : i === 2 ? " medal-3" : "");
        el.innerHTML = `
          <div class="row" data-name="${escapeHtml(r.name)}">
            <div class="rank">${escapeHtml(displayRank)}</div>
            <div class="name">${escapeHtml(r.name)}</div>
            <div class="pts">${(r.total || 0).toFixed(2)}</div>
            <div class="chevron">&#9656;</div>
          </div>
          <div class="roster">${renderRoster(r.name)}</div>
        `;
        el.querySelector(".row").addEventListener("click", () => {
          if (openNames.has(r.name)) openNames.delete(r.name);
          else openNames.add(r.name);
          el.classList.toggle("open");
        });
        app.appendChild(el);
      }
    }

    async function fetchCSV(url, timeoutMs) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(withCacheBust(url), { cache: "no-store", signal: controller.signal });
        if (!res.ok) throw new Error(`Fetch failed: HTTP ${res.status}`);
        return await res.text();
      } finally {
        clearTimeout(timeout);
      }
    }

    async function load() {
      hint.textContent = "";
      updated.textContent = "Updating…";

      try {
        if (!CSV_URL || CSV_URL.includes("PASTE_YOUR")) {
          throw new Error("CSV_URL is not set. Paste your published CSV link into CSV_URL.");
        }

        // Roster data is optional — if not set up yet, the leaderboard still works,
        // it just won't have anything to show when a name is expanded.
        if (ROSTER_CSV_URL && !ROSTER_CSV_URL.includes("PASTE_YOUR")) {
          try {
            const rosterText = await fetchCSV(ROSTER_CSV_URL, 10000);
            rosterByName = parseRoster(rosterText);
          } catch (e) {
            console.error("Roster fetch failed:", e);
          }
        }

        const text = await fetchCSV(CSV_URL, 10000);

        const firstLine = (text.split(/\r?\n/)[0] || "").trim();
        hint.textContent = firstLine ? ("CSV header: " + firstLine) : "";

        const roundLabel = parseRoundLabel(text);
        const roundEl = document.getElementById("roundBanner");
        if (roundLabel) {
          roundEl.textContent = "🏈 Current Round: " + roundLabel;
          roundEl.classList.add("show");
        } else {
          roundEl.classList.remove("show");
        }

        const rows = parseLeaderboard(text);
        if (!rows.length) {
          throw new Error("Parsed 0 rows. Make sure PublicLeaderboard has data and is published as CSV.");
        }

        render(rows);
        updated.textContent = "Updated: " + new Date().toLocaleString();
      } catch (e) {
        const msg = (e && e.name === "AbortError")
          ? "Fetch timed out (10s). Check your CSV publish link."
          : (e && e.message ? e.message : String(e));

        app.innerHTML = `<div class="card"><div class="row"><div class="error">${escapeHtml(msg)}</div></div></div>`;
        updated.textContent = "Update failed";
        console.error(e);
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("toggle").addEventListener("click", () => {
      showTop10 = !showTop10;
      document.getElementById("toggle").textContent = showTop10 ? "Show All" : "Show Top 10";
      load();
    });

    load();
  </script>
</body>
</html>
